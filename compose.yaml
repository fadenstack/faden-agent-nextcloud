name: fadenstack-nextcloud-dev
services:
  nextcloud35:
    image: nextcloud:35-apache
    entrypoint: ["/bin/sh", "/opt/fadenstack-dev/start.sh"]
    ports:
      - "127.0.0.1:8090:80"
    environment:
      NEXTCLOUD_ADMIN_USER: pilot-admin
      NEXTCLOUD_ADMIN_PASSWORD: local-pilot-only
      NEXTCLOUD_TRUSTED_DOMAINS: localhost 127.0.0.1
      SQLITE_DATABASE: nextcloud
    volumes:
      - nextcloud35:/var/www/html
      - ./:/var/www/html/custom_apps/fadenstack_agent
      - ./dev:/opt/fadenstack-dev:ro
      - ./dev/hooks:/docker-entrypoint-hooks.d:ro
  nextcloud:
    image: nextcloud:31-apache
    entrypoint: ["/bin/sh", "/opt/fadenstack-dev/start.sh"]
    ports:
      - "127.0.0.1:8088:80"
    environment:
      NEXTCLOUD_ADMIN_USER: pilot-admin
      NEXTCLOUD_ADMIN_PASSWORD: local-pilot-only
      NEXTCLOUD_TRUSTED_DOMAINS: localhost 127.0.0.1
      SQLITE_DATABASE: nextcloud
    volumes:
      - nextcloud:/var/www/html
      - ./:/var/www/html/custom_apps/fadenstack_agent
      - ./dev:/opt/fadenstack-dev:ro
      - ./dev/hooks:/docker-entrypoint-hooks.d:ro
volumes:
  nextcloud:
  nextcloud35:

name: Release

# A tag v<version> builds the app's package (fadenstack_agent-<version>.tar.gz) and makes a GitHub release with it. The
# version is the one in package.json, appinfo/info.xml and src/version.ts (scripts/version.mjs sets them), and the tag
# must name it. A version with a suffix (v0.2.0-beta.1) makes a pre-release.
#
# The jobs, in order:
#   build           checks, tests and builds, prepares the production PHP dependencies and packages the app once (the
#                   run's artifact `package`).
#   github-release  a GitHub release for the tag, holding that package.
#   supply-chain    core's shared release workflow (fadenstack/fadenstack, pinned by commit): an SBOM of the package to
#                   BSI TR-03183-2, the OSV scan with OpenVEX and CSAF (.vex/openvex.json holds this repository's
#                   statements), the OpenSSF Scorecard, keyless cosign signatures and GitHub's attestations, all added
#                   to the release.
#
# The Nextcloud App Store is not part of this workflow: its upload carries a signature made with the app's private key,
# which never enters GitHub. RELEASING.md says how the package from this release is signed and uploaded.
#
# Run by hand (workflow_dispatch) it is a dry run: build and the supply chain's SBOM, scan and Scorecard only, shown in
# the run's summary; nothing is signed, uploaded or released.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: The version (a tag names it)
        id: version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$(node scripts/version.mjs --check "${GITHUB_REF_NAME#v}")
          else
            version=$(node scripts/version.mjs --check)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run stylelint
      - run: npm test
      - run: npm run build

      - name: Production PHP dependencies
        run: node scripts/prepare-php.mjs

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          npm run package
          test -f "build/fadenstack_agent-$VERSION.tar.gz"
          sha256sum "build/fadenstack_agent-$VERSION.tar.gz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: build/fadenstack_agent-*.tar.gz
          if-no-files-found: error

  github-release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package

      # A rerun finds the release already made and replaces its file with this run's.
      - name: Create the release with the package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find package -type f -name '*.tar.gz' | sort)
          [ "${#files[@]}" -eq 1 ] || { echo "::error::Expected one package in the artifact"; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
            exit 0
          fi
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag "${prerelease[@]}" \
            --title "Fadenstack Agent for Nextcloud $VERSION" \
            --notes "The app's package, the same file the Nextcloud App Store gets. What changed is in CHANGELOG.md. The supply-chain job adds the SBOM (CycloneDX, BSI TR-03183-2), the vulnerability report (OpenVEX, CSAF), a cosign signature and the build provenance." \
            "${files[@]}"

  supply-chain:
    needs: [build, github-release]
    # On a tag after the GitHub release; run by hand, a dry run without one.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.github-release.result == 'success' || (github.ref_type != 'tag' && needs.github-release.result == 'skipped')) }}
    # The called workflow asks for more than read on its publish job, and a caller must grant that ceiling or the run does
    # not start. A dry run never uses the write grants: that job is skipped. No secrets are passed: keyless signing in a
    # public repository needs none.
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
      actions: read
    uses: fadenstack/fadenstack/.github/workflows/release-supply-chain.yml@f7c915a32ad64f725be51b3154484bfc81fbbec1
    with:
      product: fadenstack-agent-nextcloud
      version: ${{ needs.build.outputs.version }}
      release_tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      supplier_name: Emagin8 UG (haftungsbeschränkt)
      supplier_url: https://fadenstack.com
      licence: AGPL-3.0-or-later
      files_artifact: package
      files: "fadenstack_agent-*.tar.gz"
      signing: keyless
      attest: true
      dry_run: ${{ github.ref_type != 'tag' }}
      tools_ref: f7c915a32ad64f725be51b3154484bfc81fbbec1
